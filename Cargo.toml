[workspace]
resolver = "2"
members = ["crates/mathcore", "crates/mathraster", "crates/mathcli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AHAariyan/latex_rendering_engine"

[workspace.dependencies]
ttf-parser = "0.25"
tiny-skia = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
