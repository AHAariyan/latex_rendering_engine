[workspace]
resolver = "2"
members = ["crates/mathcore", "crates/mathraster", "crates/mathcli", "crates/mathffi", "crates/mathjni", "crates/mathwasm", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AHAariyan/latex_rendering_engine"

[workspace.dependencies]
ttf-parser = "0.25"
tiny-skia = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Release speed with unwinding kept, so the corpus checker and the fuzzer can
# catch a panic and report the input that caused it instead of aborting.
[profile.fuzz]
inherits = "release"
panic = "unwind"

# What the SDK pipeline ships: release speed, but a panic unwinds to the C ABI
# boundary, where it becomes an error return instead of killing the host app.
[profile.sdk]
inherits = "release"
panic = "unwind"
