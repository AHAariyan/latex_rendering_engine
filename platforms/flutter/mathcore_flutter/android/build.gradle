// FFI plugin: ships the prebuilt libmathcore_ffi.so for each ABI.
// Build them with ../../../scripts/build-android-ffi.sh before packaging.
group = "dev.mathcore.flutter"
version = "0.1.0"

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath "com.android.tools.build:gradle:8.7.0" }
}

rootProject.allprojects { repositories { google(); mavenCentral() } }

apply plugin: "com.android.library"

android {
    namespace = "dev.mathcore.flutter"
    compileSdk = 35
    defaultConfig { minSdk = 24 }
    sourceSets { main.jniLibs.srcDirs = ["src/main/jniLibs"] }
}
