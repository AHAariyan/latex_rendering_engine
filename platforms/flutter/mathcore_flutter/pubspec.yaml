name: mathcore_flutter
description: Native TeX math rendering for Flutter. A MathText widget over the mathcore Rust engine via dart:ffi; no WebView.
version: 0.1.0
repository: https://github.com/AHAariyan/latex_rendering_engine
environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"
dependencies:
  flutter:
    sdk: flutter
  mathcore_dart:
    path: ../../dart/mathcore_dart
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
