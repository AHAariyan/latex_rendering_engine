[package]
name = "mathcore"
description = "Platform-independent TeX math parser and OpenType MATH layout engine producing a display list"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Full text shaping for `\text{}`: joining forms and reordering, which Arabic
# and the Indic scripts need. Costs about 560 KB of Unicode tables. Latin,
# Greek, Cyrillic, Hebrew and CJK are handled without it; the SDKs turn it on.
complex-text = ["dep:rustybuzz"]

[dependencies]
ttf-parser = { workspace = true }
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data"] }
rustybuzz = { version = "0.20", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "layout"
harness = false
