[package]
name = "mathjni"
description = "JNI bridge for Android: exposes mathcore to dev.mathcore.NativeBridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mathcore_android"
crate-type = ["cdylib", "rlib"]

[features]
default = ["bundled-font"]
# Embed Latin Modern Math so the Kotlin side needs no font asset.
bundled-font = []

[dependencies]
mathcore = { path = "../mathcore" }
jni = "0.21"
ttf-parser = { workspace = true }
