[package]
name = "mathwasm"
description = "WebAssembly binding for mathcore: SVG output and a flat display list for canvas drawing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Passes through to mathcore: full shaping for Arabic and the Indic scripts.
complex-text = ["mathcore/complex-text"]

[dependencies]
mathcore = { path = "../mathcore" }
mathraster = { path = "../mathraster" }
wasm-bindgen = "0.2"
ttf-parser = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
