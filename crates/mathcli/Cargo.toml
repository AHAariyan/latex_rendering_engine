[package]
name = "mathcli"
description = "Command line renderer: TeX math in, PNG or SVG out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mathcli"
path = "src/main.rs"

[features]
# Passes through to mathcore: full shaping for Arabic and the Indic scripts.
complex-text = ["mathcore/complex-text"]

[dependencies]
mathcore = { path = "../mathcore" }
mathraster = { path = "../mathraster" }
anyhow = { workspace = true }
clap = { workspace = true }
