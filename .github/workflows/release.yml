# Cuts a release: every SDK built and verified at the given version, a
# release commit with the SwiftPM manifest, a tag, a GitHub release carrying
# every archive and SHA256SUMS, and the registries whose credentials are set.
#
# Secrets (all optional except the GitHub token):
#   RELEASE_TOKEN  a PAT; with it the tag push also triggers publish-pub.yml
#   NPM_TOKEN      publishes the `mathcore` npm package
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 or 1.1.0-beta.1"
        required: true

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ inputs.version }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: c, os: ubuntu-latest }
          - { platform: c, os: macos-15 }
          - { platform: c, os: windows-latest }
          - { platform: web, os: ubuntu-latest }
          - { platform: android, os: ubuntu-latest }
          - { platform: apple, os: macos-15 }
          - { platform: flutter, os: macos-15 }
          - { platform: react-native, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-${{ matrix.platform }}
      - uses: actions/setup-node@v4
        if: matrix.platform == 'web' || matrix.platform == 'react-native'
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android' || matrix.platform == 'flutter' || matrix.platform == 'react-native'
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        if: matrix.platform == 'flutter'
        with:
          channel: stable
      - name: tools
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            web) cargo install wasm-pack --locked ;;
            android|flutter|react-native) cargo install cargo-ndk --locked ;;
          esac
      - run: cargo xtask version "$VERSION"
        shell: bash
      - run: cargo xtask sdk ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Tag, release, publish
    needs: build
    runs-on: ubuntu-latest
    env:
      # A step's `if` cannot read secrets; this flag can.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect archives
        run: |
          mkdir -p release
          find artifacts \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.tgz' -o -name '*.aar' \) -exec cp {} release/ \;
          (cd release && sha256sum ./* | sed "s#  ./#  #" > SHA256SUMS)
          ls -la release
      - name: release commit with the SwiftPM manifest
        run: |
          cargo xtask version "$VERSION"
          cp artifacts/dist-apple-macos-15/apple/Package.swift Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Cargo.toml Cargo.lock Package.swift platforms
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # The CHANGELOG section for this version leads; GitHub's list of
          # merged changes follows.
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" release/* --title "mathcore $VERSION" --notes-file notes.md --generate-notes $prerelease
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: npm
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish "release/mathcore-$VERSION.tgz" --access public --tag "$tag"
          npm publish "release/react-native-mathcore-$VERSION.tgz" --access public --tag "$tag"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Maven (GitHub Packages)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          repo="artifacts/dist-android-ubuntu-latest/android/maven"
          for f in $(cd "$repo" && find . -type f \( -name '*.aar' -o -name '*.pom' -o -name '*.jar' -o -name '*.module' \)); do
            curl -sSf -u "x-access-token:$GITHUB_TOKEN" --upload-file "$repo/$f" \
              "https://maven.pkg.github.com/${{ github.repository }}/${f#./}"
          done
