name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --release -p mathcore --test robustness
      - name: wasm binding
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
          (cd crates/mathwasm && wasm-pack build --release --target nodejs --out-dir ../../platforms/web/pkg-node)
          node platforms/web/test.mjs
          node platforms/web/parity.mjs
      - name: web demo build
        run: (cd crates/mathwasm && wasm-pack build --release --target web --out-dir ../../platforms/web/pkg)
      - uses: dart-lang/setup-dart@v1
      - name: dart binding
        run: |
          cargo build --release -p mathffi
          cd platforms/dart/mathcore_dart && dart pub get && dart analyze && dart test
      - name: reference is current
        run: |
          cargo run -q -p mathcore --example parity_dump > /tmp/parity.json
          diff -q /tmp/parity.json tests/parity/expected.json
      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: tests/golden/actual
          if-no-files-found: ignore
