name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (format, lints, tests, parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci
      - name: optional shaping feature
        run: |
          cargo clippy -p mathcore --features complex-text --all-targets -- -D warnings
          cargo test -p mathcore --features complex-text
      - name: parity reference is current
        run: |
          cargo run -q -p mathcore --example parity_dump > /tmp/parity.json
          diff -q /tmp/parity.json tests/parity/expected.json
      - name: golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: tests/golden/actual
          if-no-files-found: ignore

  corpus:
    name: Real-world corpus (100k arXiv formulas, KaTeX diff, fuzzing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: target/corpus/im2latex_formulas.lst
          key: im2latex-100k
      - run: tools/corpus/run.sh

  sdk:
    name: SDK ${{ matrix.platform }} (${{ matrix.os }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: c, os: ubuntu-latest }
          - { platform: c, os: macos-15 }
          - { platform: c, os: windows-latest }
          - { platform: web, os: ubuntu-latest }
          - { platform: android, os: ubuntu-latest }
          - { platform: apple, os: macos-15 }
          - { platform: flutter, os: macos-15 }
          - { platform: react-native, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-${{ matrix.platform }}
      - uses: actions/setup-node@v4
        if: matrix.platform == 'web' || matrix.platform == 'react-native'
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android' || matrix.platform == 'flutter' || matrix.platform == 'react-native'
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        if: matrix.platform == 'flutter'
        with:
          channel: stable
      - name: tools
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            web) cargo install wasm-pack --locked ;;
            android|flutter|react-native) cargo install cargo-ndk --locked ;;
          esac
      - run: cargo xtask sdk ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}-${{ matrix.os }}
          path: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.tgz
            dist/**/*.aar
          if-no-files-found: error

  browsers:
    name: Web in Chromium, Firefox and WebKit
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-pack --locked
      - run: cargo xtask sdk web --no-verify
      - name: browsers
        working-directory: platforms/web/browser-test
        run: |
          cp demo.html ../../../dist/web/package/
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium firefox webkit
          node check.mjs ../../../dist/web/package
          cp scripts.html ../../../dist/web/package/
          node scripts.mjs ../../../dist/web/package
          cp field.html ../../../dist/web/package/
          node field.mjs ../../../dist/web/package
